				<h2 class="section-title">Diseño Gráfico</h2>

				<div class="gallery-grid">
					<button
						type="button"
						class="gallery-item"
						data-title="Identidad y Marca"

						<img
							src="../assets/img/Dise_Bass.png"
							alt="Proyecto de identidad visual — Dise_Bass"
							loading="lazy"
						/>
						<div class="gallery-caption">
							<strong>Identidad / Branding</strong>
						</div>

					<button
						type="button"
						class="gallery-item"
						data-title="Editorial y Maquetación"
						data-description="Diseño editorial, maquetación y piezas impresas para publicaciones y catálogos."

					>
						<img
							src="../assets/img/Dise_Ofufu3.png"
							alt="Proyecto editorial"
							loading="lazy"
						/>
						<div class="gallery-caption">
							<strong>Diseño Editorial</strong>
						</div>
					</button>
				</div>
			</div>
		</section>

	</main>

	<!-- Modal de proyecto -->
	<div class="project-modal" aria-hidden="true">
		<div class="modal-backdrop"></div>

		<div
			class="modal-content"
			role="dialog"
			aria-modal="true"
			aria-labelledby="modal-title"

				type="button"
				class="modal-close"
				aria-label="Cerrar proyecto"
			>
