<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>404 — Página no encontrada · Lucas Sánchez</title>
  <meta name="description" content="Página 404 — No se encontró la página. Vuelve al inicio o busca en las secciones del portafolio." />

  
  <link rel="stylesheet" href="assets/css/index.css" />

  <style>
    
    .not-found {
      padding: 6rem 1rem;
      min-height: 60vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .not-found .card {
      max-width: 920px;
      width: 100%;
      background: var(--card-bg, #fff);
      color: var(--text-color, #222);
      padding: 2rem;
      border-radius: 10px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.08);
      text-align: center;
    }

    .not-found h1 { font-size: 3.2rem; margin: .25rem 0 0.5rem; }
    .not-found p { margin: 0.25rem 0 1rem; color: #444; }

    .quick-links { margin-top: 1rem; display:flex; gap:.5rem; flex-wrap:wrap; justify-content:center; }
    .quick-links a, .quick-links button { padding:.6rem 1rem; border-radius:6px; border:1px solid rgba(0,0,0,.08); background:#f7f7f7; color:inherit; text-decoration:none; }

    @media (max-width:520px){ .not-found h1{ font-size:2.2rem } }
  </style>
</head>
<body>

  

  <main id="main" class="not-found" role="main">
    <div class="card container">
      <h1 aria-live="polite">404 — Página no encontrada</h1>
      <p>No encontramos la página que buscas. Puede que el enlace esté roto o que la dirección haya cambiado.</p>

      <div class="quick-links" aria-hidden="false">
        <a href="index.html" class="btn">Home</a>
      </div>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p>© 2025 Lucas Sánchez · Diseñador gráfico e ilustrador</p>
    </div>
  </footer>

  <script>
    // Focus the primary action (Home) for keyboard users
    (function(){
      const home = document.querySelector('.quick-links a');
      if (home) home.focus();
    })();
  </script>

</body>
</html>
